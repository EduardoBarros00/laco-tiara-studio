name: Import project on issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import application
        shell: bash
        run: |
          test -f project.tar.gz.b64
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          rm -f project.tar.gz project.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Laço & Tiara Studio [unpack]"
          git push
