name: Import Laço & Tiara Studio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-project:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[unpack]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect archive
        id: detect
        shell: bash
        run: |
          if [ -f project.tar.gz.b64 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack application
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz
          rm -f project.tar.gz project.tar.gz.b64

      - name: Commit imported application
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Laço & Tiara Studio [unpack]"
          git push
